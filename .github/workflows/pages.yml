name: Shared Memory Lab

# Publishes showcase/ (the built site and its recorded trace) to GitHub Pages
# whenever it changes on master.
on:
  push:
    branches: [master]
    paths: [showcase/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Keep only the site
        run: mkdir site && cp showcase/index.html showcase/trace.json site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
