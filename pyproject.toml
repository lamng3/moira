[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moira"
dynamic = ["version"]
description = "Memory-augmented ontology integration with cost-bounded reasoning agents"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Lam Nguyen", email = "lamng3.work@gmail.com" },
  { name = "Ethan Frakes", email = "ethan@ethanfrakes.com" },
]
license = "MIT"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "boto3",
  "gensim",
  "langchain-core",
  "langchain-ollama",
  "langchain-together",
  "matplotlib",
  "networkx",
  "node2vec",
  "numpy",
  "python-dotenv",
  "rdflib",
  "requests",
  "scikit-learn",
  "scipy",
  "tiktoken",
  "torch",
  "transformers",
]

[project.optional-dependencies]
google = ["langchain-google-genai"]
groq = ["groq", "langchain-groq"]
huggingface = ["langchain-huggingface"]
jev = ["rag-jev", "langchain-typesafe"]
knowledge-graph = ["neo4j"]
ollama = ["langchain-ollama", "ollama"]
openai = ["langchain-openai", "openai"]
tracking = ["wandb"]
traces = ["duckdb"]
uq = ["uqlm"]
website = ["tavily-python"]
dev = ["pre-commit", "pytest"]
all = [
  "moira[google,groq,huggingface,jev,knowledge-graph,ollama,openai,tracking,traces,uq,website]",
]

[project.scripts]
moira = "moira.cli:main"
moira-hypergraph = "moira.hypergraph:main"
moira-lint = "moira.validation.ontology_lint:main"

[project.urls]
Documentation = "https://lamng3.github.io/moira-docs/"
Repository = "https://github.com/lamng3/moira"

[tool.setuptools.dynamic]
version = {attr = "moira.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["moira*"]

[tool.setuptools.package-data]
moira = [
  "parser/namespaces/*.json",
  "agents/tools/registry/*.json",
  "agents/tools/knowledge_graph/*.json",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
