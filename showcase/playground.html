<style>
/* Playground: a graph you edit on the left, the agents reacting on the right. Details live in hover tooltips. */
.pg-bar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-bottom: 10px; }
.pg-bar select, .pg-field { font: inherit; font-size: 13px; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; min-width: 0; max-width: 100%; }
.pg-upload { position: relative; overflow: hidden; }
.pg-upload input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.seg button[aria-pressed="true"].atk { background: var(--c-attacker); }
.seg button[aria-pressed="true"].cur { background: var(--ok); }
.pg-stat { font-family: var(--f-mono); font-size: 12px; color: var(--muted); margin-left: auto; }
.pg-feed { display: grid; gap: 2px; margin-bottom: 10px; min-height: 66px; }
.pg-feed div { font-size: 13px; display: flex; gap: 8px; align-items: baseline; }
.pg-feed div:nth-child(n+2) { opacity: .5; }
.pg-feed b { font-family: var(--f-mono); font-size: 11px; font-weight: 500; color: var(--c); min-width: 56px; text-align: right; }
.pg-grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 14px; align-items: start; }
@media (max-width: 960px) { .pg-grid { grid-template-columns: minmax(0, 1fr); } }
.pg-canvas { position: relative; height: 600px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); overflow: hidden; touch-action: none; }
@media (max-width: 600px) { .pg-canvas { height: 460px; } }
.pg-canvas svg { width: 100%; height: 100%; display: block; cursor: grab; user-select: none; }
.pg-canvas svg.panning { cursor: grabbing; }
.pg-canvas svg.linking { cursor: crosshair; }
.pg-tools { position: absolute; top: 10px; left: 10px; display: flex; gap: 4px; flex-wrap: wrap; z-index: 2; }
.pg-tools button, .pg-find { border: 1px solid var(--line); background: var(--panel); border-radius: 7px; padding: 4px 9px; font-size: 12.5px; font-weight: 500; }
.pg-tools button[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.pg-find { position: absolute; top: 10px; right: 10px; width: 190px; z-index: 2; font: inherit; font-size: 12.5px; color: var(--ink); }
@media (max-width: 600px) { .pg-find { top: 46px; left: 10px; right: auto; } }
.pg-insp { position: absolute; left: 10px; bottom: 10px; right: 10px; max-width: 560px; z-index: 2; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 8px; box-shadow: 0 4px 18px rgb(0 0 0 / .08); }
.pg-insp:empty { display: none; }
.pg-insp .t { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.pg-insp .t b { font-size: 14px; }
.pg-acts { display: flex; flex-wrap: wrap; gap: 6px; }
.pg-acts .btn { font-size: 12.5px; padding: 4px 10px; }
.btn.atk { border-color: var(--c-attacker); color: var(--c-attacker); }
.btn:disabled { opacity: .45; cursor: default; }
.pg-legend { position: absolute; right: 10px; bottom: 10px; z-index: 1; display: flex; gap: 10px; font-size: 11px; color: var(--muted); background: var(--panel); padding: 3px 6px; border-radius: 6px; }
.pg-legend span::before { content: ""; display: inline-block; width: 14px; border-top: 2px solid var(--c); margin-right: 4px; vertical-align: middle; }
.pg-legend span.d::before { border-top-style: dashed; }
/* graph */
.gn rect { fill: var(--panel); stroke: var(--muted); stroke-width: 1.2; }
.gn text { font-size: 12px; fill: var(--ink); pointer-events: none; }
.gn { cursor: pointer; }
.gn.root rect { stroke: var(--ink); stroke-width: 1.8; }
.gn.asked rect { stroke: var(--c-moira); stroke-width: 2.2; }
.gn.asked text { fill: var(--c-moira); font-weight: 600; }
.gn.hit rect { fill: var(--bad-bg); stroke: var(--c-attacker); stroke-width: 2.2; }
.gn.hit text { fill: var(--c-attacker); font-weight: 600; }
.gn.ghost rect { fill: none; stroke: var(--c-attacker); stroke-dasharray: 4 3; }
.gn.ghost text { fill: var(--c-attacker); }
.gn.sel rect { stroke: var(--accent); stroke-width: 3; }
.gn.drop rect { fill: var(--sunk); stroke: var(--accent); stroke-width: 3; }
.gn .badge circle { fill: var(--sunk); stroke: var(--line); }
.gn .badge text { font-size: 10px; font-family: var(--f-mono); fill: var(--muted); pointer-events: none; }
.ge { stroke: var(--muted); stroke-width: 1.3; fill: none; }
.ge.extra { stroke-dasharray: 2 3; }
.ge.added { stroke: var(--c-attacker); stroke-width: 2.2; }
.ge.removed { stroke: var(--c-attacker); stroke-dasharray: 5 4; opacity: .7; }
.ge.sel { stroke: var(--accent); stroke-width: 3; }
.ge-hit { stroke: transparent; stroke-width: 12; fill: none; cursor: pointer; }
.ge-temp { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 4 3; fill: none; pointer-events: none; }
/* side */
.pg-side { display: grid; gap: 12px; }
.pg-card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 8px; min-width: 0; }
.pg-card h3 { display: flex; align-items: center; gap: 6px; font-size: 13px; }
.pg-card h3 i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
.pg-card h3 .info { margin-left: auto; color: var(--muted); font-weight: 400; cursor: help; font-size: 12px; }
.pg-card.alarm { border-color: var(--bad); box-shadow: 0 0 0 3px var(--bad-bg); }
.pg-q { display: grid; gap: 4px; }
.pg-q .h { display: flex; justify-content: space-between; gap: 6px; font-size: 13px; }
.pg-chips { display: flex; flex-wrap: wrap; gap: 3px; }
.pg-chips span { font-size: 11.5px; padding: 1px 6px; border-radius: 5px; background: var(--sunk); }
.pg-chips span.wrong { background: var(--bad-bg); color: var(--bad); font-weight: 600; }
.pg-chips span.missing { color: var(--bad); text-decoration: line-through; border: 1px dashed var(--bad); background: transparent; }
.pg-harm { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.pg-harm .v { font-family: var(--f-mono); font-size: 20px; font-variant-numeric: tabular-nums; }
.pg-worst { display: grid; gap: 4px; }
.pg-worst div { display: grid; grid-template-columns: minmax(0, 1fr) 44px auto; gap: 6px; align-items: center; font-size: 12.5px; }
.pg-worst span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pg-tiers { display: flex; gap: 10px; flex-wrap: wrap; font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); }
.pg-tiers b { color: var(--ink); font-weight: 500; }
.pg-tiers span { cursor: help; }
.pg-recs { display: grid; gap: 1px; font-family: var(--f-mono); font-size: 11px; max-height: 150px; overflow: auto; }
.pg-recs div { display: grid; grid-template-columns: 26px 50px 46px minmax(0, 1fr); gap: 5px; }
.pg-recs div span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pg-vers { display: flex; flex-wrap: wrap; gap: 4px; }
.vchip { font-family: var(--f-mono); font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); cursor: help; }
.vchip.attacker { border-color: var(--c-attacker); color: var(--c-attacker); }
.vchip.curator { border-color: var(--ok); color: var(--ok); }
.vchip.rollback { border-color: var(--c-aegis); color: var(--c-aegis); }
.vchip.base { background: var(--ok-bg); }
.vchip.now { outline: 2px solid var(--ink); outline-offset: 1px; }
.pg-sugg { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 12px; }
.pg-rsel { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 7px; padding: 3px 6px; font: inherit; font-size: 12.5px; }
.gr { stroke: var(--c-kroma); stroke-width: 1.4; stroke-dasharray: 6 4; fill: none; }
.gr.added { stroke: var(--c-attacker); stroke-width: 2.2; }
.gr.removed { stroke: var(--c-attacker); opacity: .55; }
.gr.sel { stroke: var(--accent); stroke-width: 3; }
.grl { font-size: 10.5px; fill: var(--c-kroma); font-style: italic; pointer-events: none; paint-order: stroke; stroke: var(--panel); stroke-width: 3px; }
.pg-relform { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pg-relform input, .pg-relform select { font: inherit; font-size: 12.5px; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 4px 8px; min-width: 0; }
.pg-relform input { width: 150px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>

<section id="tab-play" role="tabpanel" hidden>
  <div class="pg-bar">
    <label class="sr" for="pg-sample">Ontology</label>
    <select id="pg-sample" title="Sample ontologies, exported through Aegis's OWL loader"></select>
    <span class="btn pg-upload" title="OWL / RDF-XML, Turtle, N-Triples, OBO or JSON. The file stays in your browser.">Upload<input id="pg-file" type="file" accept=".owl,.rdf,.xml,.ttl,.nt,.obo,.json" aria-label="Upload an ontology"></span>
    <div class="seg" role="group" aria-label="Who is editing">
      <button id="pg-cur" class="cur" aria-pressed="false" title="Reviewed edits: each one becomes the new truth.">Curator</button>
      <button id="pg-atk" class="atk" aria-pressed="true" title="Unreviewed edits: Aegis measures the harm against the last accepted version.">Attacker</button>
    </div>
    <label class="toggle" title="Aegis rolls back by itself when harm crosses 0.05"><input type="checkbox" id="pg-auto"> Auto-defend</label>
    <button class="btn" id="pg-reset" title="Reload this ontology and start over: versions, questions and memory are cleared">Reset</button>
    <span class="pg-stat" id="pg-stat"></span>
  </div>
  <div class="pg-feed" id="pg-feed" aria-live="polite"></div>
  <div class="pg-grid">
    <div class="pg-canvas" id="pg-canvas">
      <div class="pg-tools">
        <button id="pg-fit" title="Fit the graph to the view">Fit</button>
        <button id="pg-zin" title="Zoom in" aria-label="Zoom in">+</button>
        <button id="pg-zout" title="Zoom out" aria-label="Zoom out">−</button>
        <button id="pg-tidy" title="Undo manual positions and lay the graph out again">Tidy</button>
        <label class="sr" for="pg-rtype">Relation type</label>
        <select id="pg-rtype" class="pg-rsel" title="The relation to draw. Only “is a” changes MOIRA's answers; the others are stored and versioned alongside."><option>is a</option><option>part of</option><option>has part</option><option>made of</option><option>located in</option></select>
        <button id="pg-link" aria-pressed="false" title="Draw mode: drag from one concept to another to add the chosen relation. Shift-drag works anytime.">Draw relation</button>
        <button id="pg-new" title="Add a concept under the selected one (or a new top-level concept)">+ Concept</button>
        <button id="pg-newrel" title="Add a relation by name: from, type, to">+ Relation</button>
      </div>
      <input id="pg-find" class="pg-find" type="search" list="pg-labels" placeholder="Find a concept" aria-label="Find a concept">
      <datalist id="pg-labels"></datalist>
      <svg id="pg-svg" role="img" aria-label="Ontology graph">
        <defs>
          <marker id="pg-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--muted)"/></marker>
          <marker id="pg-arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--c-attacker)"/></marker>
        </defs>
        <g id="pg-world"></g>
      </svg>
      <div class="pg-insp" id="pg-insp"></div>
      <div class="pg-legend"><span style="--c:var(--c-moira)" title="Concepts you asked MOIRA about">asked</span><span style="--c:var(--c-attacker)" title="Changed since the last accepted version">changed</span><span class="d" style="--c:var(--c-attacker)" title="Relations that were there in the accepted version">removed</span><span class="d" style="--c:var(--c-kroma)" title="Relations other than “is a” (part of, made of, …)">other relation</span></div>
    </div>
    <div class="pg-side">
      <div class="pg-card" style="--c:var(--c-moira)"><h3><i></i>MOIRA<span class="info" title="Relational reasoning agent. Answers “what kinds of X” from the ontology. Aegis guards every question you ask.">ⓘ</span></h3><div id="pg-qs"></div></div>
      <div class="pg-card" id="pg-aegis" style="--c:var(--c-aegis)"><h3><i></i>Aegis<span class="info" title="White hat. Red team: searches single edits for the most harmful. Guard: measures harm to your questions after every unreviewed edit, alarms above 0.05, and rolls back.">ⓘ</span></h3><div id="pg-guard"></div></div>
      <div class="pg-card" style="--c:var(--c-mneme)"><h3><i></i>Mneme<span class="info" title="The memory every agent shares. Each question, answer, match and version is a memory with what it was built from. When a premise stops holding, everything built on it goes stale; identical work later is restored, same id.">ⓘ</span></h3><div id="pg-mem"></div></div>
      <div class="pg-card" style="--c:var(--c-ontodb)"><h3><i></i>OntoDB<span class="info" title="Keeps every version of the ontology (and Mneme's log). Green: the accepted version Aegis measures against. Outlined: the current one.">ⓘ</span></h3><div class="pg-vers" id="pg-vers"></div></div>
    </div>
  </div>
</section>

<script id="samples" type="application/json">__SAMPLES__</script>
<script>
(() => {
const SAMPLES = JSON.parse(document.getElementById('samples').textContent);
const $ = (s) => document.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') n.className = v; else if (k === 'style') n.setAttribute('style', v);
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v); else if (v !== undefined && v !== null && v !== false) n.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) if (k !== null && k !== undefined && k !== false) n.append(k.nodeType ? k : document.createTextNode(String(k)));
  return n;
};
const NS = 'http://www.w3.org/2000/svg';
const sv = (tag, attrs = {}, ...kids) => { const n = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) if (v !== undefined && v !== null) n.setAttribute(k, v); for (const k of kids) if (k !== null && k !== undefined) n.append(k.nodeType ? k : document.createTextNode(String(k))); return n; };
const COLOR = { user: 'var(--c-user)', moira: 'var(--c-moira)', kroma: 'var(--c-kroma)', aegis: 'var(--c-aegis)', mneme: 'var(--c-mneme)', ontodb: 'var(--c-ontodb)', you: 'var(--c-attacker)', curator: 'var(--ok)' };
const NAME = { user: 'User', moira: 'MOIRA', kroma: 'KROMA', aegis: 'Aegis', mneme: 'Mneme', ontodb: 'OntoDB', you: 'Attacker', curator: 'Curator' };
const THRESHOLD = 0.05, SHORT_CAP = 12;

function hash(str) {
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < str.length; i++) { const c = str.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (h2 >>> 0).toString(16).padStart(8, '0') + (h1 >>> 0).toString(16).padStart(8, '0').slice(0, 4);
}

// ---------- ontology ----------
const key = (c, p) => c + '\u0001' + p;
const unkey = (k) => k.split('\u0001');
function index(edges) {
  const par = new Map(), kids = new Map();
  for (const k of edges) { const [c, p] = unkey(k);
    if (!par.has(c)) par.set(c, []); par.get(c).push(p);
    if (!kids.has(p)) kids.set(p, []); kids.get(p).push(c); }
  return { par, kids };
}
function below(idx, t) {
  const out = new Set(), todo = [t];
  while (todo.length) for (const k of idx.kids.get(todo.pop()) || []) if (!out.has(k)) { out.add(k); todo.push(k); }
  out.delete(t); return out;
}
function f1(got, gold) {
  if (!got.size && !gold.size) return 1;
  let hit = 0; for (const g of got) if (gold.has(g)) hit++;
  if (!hit) return 0;
  const p = hit / got.size, r = hit / gold.size; return 2 * p * r / (p + r);
}

// ---------- state ----------
let S = null, mode = 'attacker', sel = null, selEdge = null, adding = false, relForm = false, worst = null, feed = [], linkMode = false, current = null;
const RKEY = (c, r, d) => 'r\u0002' + c + '\u0001' + r + '\u0001' + d;
const unr = (k) => k.slice(2).split('\u0001');
const V = { shown: new Set(), pos: new Map(), k: 1, tx: 0, ty: 0, laid: new Map(), ghosts: new Set() };

function load(sample) {
  const labels = { ...sample.labels };
  const nodes = new Set(Object.keys(labels));
  const edges = new Set();
  for (const [c, p] of sample.edges) if (c !== p && nodes.has(c) && nodes.has(p)) edges.add(key(c, p));
  current = sample;
  S = { name: sample.name, labels, nodes, edges, rels: new Set(), idx: index(edges), versions: [], base: 0, cur: 0, questions: [],
        M: { lsn: 0, recs: [], mem: new Map(), tick: 0 }, cache: new Map() };
  sel = null; selEdge = null; adding = false; relForm = false; worst = null; feed = [];
  newVersion('load', `loaded ${sample.name}`);
  S.base = 0;
  $('#pg-labels').replaceChildren(...Object.values(labels).slice(0, 6000).map((l) => el('option', { value: l })));
  initView();
  say('ontodb', `Loaded ${sample.name}: ${nodes.size.toLocaleString()} concepts → v0`);
}

// ---------- Mneme ----------
function rec(op, agent, m, reason = '', tier = '') { S.M.lsn++; S.M.recs.push({ lsn: S.M.lsn, op, agent, kind: m.kind, key: m.key, reason, tier }); }
function put(agent, kind, k, body, derived = [], tier = 'short') {
  const id = 'm:' + hash(JSON.stringify([kind, k, body, derived]));
  const old = S.M.mem.get(id);
  if (old) { let how = 'same'; if (old.status !== 'live') { old.status = 'live'; rec('restore', agent, old, 'same work again'); how = 'restored'; } use(old); return [old, how]; }
  const m = { id, kind, key: k, body, derived, source: agent, status: 'live', tier, uses: 0, last: ++S.M.tick };
  S.M.mem.set(id, m); rec('put', agent, m, '', tier); return [m, 'new'];
}
function stale(id, agent, reason) {
  const out = []; const todo = [id];
  while (todo.length) { const x = todo.pop(); const m = S.M.mem.get(x); if (!m || m.status !== 'live') continue;
    m.status = 'stale'; rec('stale', agent, m, reason); out.push(m);
    for (const d of S.M.mem.values()) if (d.status === 'live' && d.derived.includes(x)) todo.push(d.id); }
  return out;
}
function use(m) { m.uses++; m.last = ++S.M.tick; if (m.tier === 'archive' && m.status === 'live') { m.tier = 'short'; rec('move', 'mneme', m, 'paged in', 'short'); } }
function maintain() {
  for (const m of S.M.mem.values()) {
    if (m.tier === 'short' && m.status !== 'live') { m.tier = 'archive'; rec('move', 'mneme', m, 'no longer holds', 'archive'); }
    else if (m.tier === 'short' && m.uses >= 3) { m.tier = 'long'; rec('move', 'mneme', m, 'promoted', 'long'); }
  }
  const short = [...S.M.mem.values()].filter((m) => m.tier === 'short').sort((a, b) => a.last - b.last);
  while (short.length > SHORT_CAP) { const m = short.shift(); m.tier = 'archive'; rec('move', 'mneme', m, 'evicted (LRU)', 'archive'); }
}

// ---------- versions ----------
const digest = (nodes, edges, rels = S.rels) => hash([...nodes].sort().join('|') + '#' + [...edges].sort().join('|') + '#' + [...rels].sort().join('|'));
function versionMem(v) { return put('aegis', 'ontology_version', `${S.name}@v${v.n}`, { digest: v.digest }, [], 'long')[0]; }
function newVersion(by, note) {
  const n = S.versions.length;
  const v = { n, by, note, nodes: new Set(S.nodes), edges: new Set(S.edges), rels: new Set(S.rels), digest: digest(S.nodes, S.edges) };
  S.versions.push(v);
  const prev = S.versions[S.cur];
  v.mem = versionMem(v).id;
  const staled = n > 0 && prev && prev.mem !== v.mem ? stale(prev.mem, 'aegis', `superseded by v${n}`) : [];
  S.cur = n;
  return staled;
}

// ---------- MOIRA ----------
const lab = (c) => S.labels[c] ?? c;
const qtext = (t) => `What kinds of ${lab(t)} are there?`;
function answer(q) {
  const got = S.nodes.has(q.target) ? below(S.idx, q.target) : new Set();
  const v = S.versions[S.cur];
  const [m, how] = put('moira', 'answer', qtext(q.target), { answer: [...got].sort() }, [q.mem, v.mem]);
  for (const r of [q.mem, v.mem]) { const x = S.M.mem.get(r); if (x) use(x); }
  q.answer = m.id; S.cache.set(q.target, m.id);
  return how;
}
function ask(t) {
  let q = S.questions.find((x) => x.target === t);
  if (q) { const m = S.M.mem.get(S.cache.get(t)); if (m && m.status === 'live') { use(m); say('moira', `kinds of ${lab(t)}: from cache`); maintain(); render(); return; } }
  const [qm] = put('user', 'question', qtext(t), { question: qtext(t) });
  if (!q) { q = { target: t, mem: qm.id, gold: below(index(S.versions[S.base].edges), t), answer: null }; S.questions.push(q); }
  answer(q);
  say('moira', `kinds of ${lab(t)}: ${below(S.idx, t).size} concepts · Aegis now guards it`);
  maintain(); render();
}
function reanswer() { let restored = 0; for (const q of S.questions) if (answer(q) === 'restored') restored++; return restored; }

// ---------- Aegis ----------
function harmOf(edges, nodes) {
  if (!S.questions.length) return 0;
  const idx = edges === S.edges ? S.idx : index(edges);
  let lost = 0;

$('#pg-fit').onclick = fit; $('#pg-zin').onclick = () => zoom(1.25); $('#pg-zout').onclick = () => zoom(0.8);
$('#pg-tidy').onclick = () => { V.pos.clear(); draw(); fit(); };
$('#pg-link').onclick = () => { linkMode = !linkMode; render(); };
$('#pg-newrel').onclick = () => { relForm = true; adding = false; selEdge = null; renderInsp(); };
$('#pg-reset').onclick = () => { const wasFirst = current === SAMPLES[0]; mode = 'attacker'; linkMode = false; load(current); if (wasFirst) starter(); else render(); requestAnimationFrame(fit); };
$('#pg-new').onclick = () => { if (sel && S.nodes.has(sel)) { adding = true; renderInsp(); } else addConcept('New concept ' + S.versions.length, null); };
$('#pg-find').addEventListener('change', (e) => { const v = e.target.value.trim().toLowerCase(); if (!v) return;
  const hit = [...S.nodes].find((c) => String(lab(c)).toLowerCase() === v) || [...S.nodes].find((c) => String(lab(c)).toLowerCase().includes(v));
  if (hit) { focus(hit); sel = hit; render(); fit(); } });
new MutationObserver(() => { if (!$('#tab-play').hidden) requestAnimationFrame(fit); }).observe($('#tab-play'), { attributes: true, attributeFilter: ['hidden'] });
window.addEventListener('resize', () => requestAnimationFrame(fit));
function starter() { feed = []; ask('Material'); feed = []; say('user', 'Try: drag Metal onto Temperature, or press Find worst attack'); render(); }
load(SAMPLES[0]); starter();
})();
</script>
